name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false



      - name: Setup Node.js ⚙️
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Initialize (Install Deps) 📦
        run: make init

      - name: Build for GitHub Pages 🏗️
        # We extract the repository name automatically (e.g., "user/repo" -> "repo")
        run: |
          REPO_NAME=${GITHUB_REPOSITORY#*/}
          make build-gh REPO_NAME=$REPO_NAME

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: dist/swimming-game/browser # Update 'swimming-game' if your package.json name differs
          branch: gh-pages
